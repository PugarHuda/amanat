version: "1"
kind: miner
id: 20260821
slug: amanat-weather-risk
protocol: generic
name: Amanat Weather Risk
description: >
  Parametric weather-risk signals for autonomous systems. Every answer carries a
  plain-language summary and the scalars behind it — temperature, wind, gusts,
  precipitation and a storm-risk score — so the same response can be graded by a
  Telegraph scoring module and acted on by a smart contract through an ERC-8183
  job. Backed by Open-Meteo; no API key, no rate-limit surprises.
base_url: https://amanat-miner.vercel.app

docs:
  website: https://github.com/PugarHuda/amanat
  documentation: https://github.com/PugarHuda/amanat/blob/main/miner/README.md
  repository: https://github.com/PugarHuda/amanat

# Open-Meteo's free tier is 10k calls/day. Declaring it means the node refuses a
# request that would blow the quota BEFORE charging the caller, instead of
# letting a runaway agent burn it and fail every later request.
limitations:
  - code: ACCOUNT_QUOTA
    message: Open-Meteo free tier allows 10000 requests per day
    property: rate
    value_num: 10000
    window_seconds: 86400
  # A MAX_PARAM_VALUE limit on `hours` was declared here and had to be removed:
  # the node evaluates `operator: lte` inverted. It refuses hours=0 and hours=2
  # as violating "lte 168", and lets hours=200 through. Declaring the real limit
  # therefore blocked every legitimate direct call and every job, which send
  # hours=1. The server validates the range itself and answers 400, which is the
  # check that was working all along.

# Failures come back as real HTTP status codes, so there is no status_path to
# declare — a 4xx/5xx already tells the node not to charge for the call.
errors:
  message_path: error

rate_limit_per_sec: 5
cache_ttl_sec: 300
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /forecast
    external_path: /forecast
    method: POST
    description: Weather and storm-risk forecast for a place, at an hour offset. Takes lat/lon or a plain-language question.

# Either a coordinate pair or a question naming a place. `required` is left off
# deliberately: the epoch tournament puts one plain-language sentence to every
# miner on an intent, and a schema demanding lat/lon makes that sentence
# unanswerable — which is how this miner scored zero on three intents while
# serving 296 direct requests correctly. The server enforces the real rule: one
# of the two forms must be present, and neither is allowed to default to zero.
input_schema:
  type: object
  properties:
    lat: { type: number, minimum: -90, maximum: 90, description: Latitude in decimal degrees. Requires lon. }
    lon: { type: number, minimum: -180, maximum: 180, description: Longitude in decimal degrees. Requires lat. }
    # Block style, not the flow mapping the neighbours use: a description that
    # wants a comma or a question mark cannot live inside { } as a plain scalar.
    # Written that way, this file stopped parsing at all, and the node rejected
    # registration 217 with an empty error list because it never got far enough
    # to have a complaint. Quoting is what makes the punctuation safe.
    question:
      type: string
      description: "A plain-language weather question naming a place, e.g. 'Will Riyadh exceed 40 degrees in the next 24 hours?'. Used when lat and lon are absent."
    hours: { type: integer, minimum: 0, maximum: 168, description: Hours ahead of now. 0 is the current hour. Read from the question when absent. }

output_schema:
  type: object
  properties:
    summary: { type: string, description: Plain-language forecast. Opens with the day, the condition and the daily range, then the hour being asked about. }
    condition: { type: string, description: WMO present-weather condition for that hour, e.g. Overcast or Thunderstorm. Null when the code is unrecognised. }
    weather_code: { type: integer, description: WMO 4677 present-weather code for that hour. }
    temp_min_c: { type: number, description: Lowest temperature that day in degrees Celsius. }
    temp_max_c: { type: number, description: Highest temperature that day in degrees Celsius. }
    temp_c: { type: number, description: Temperature in degrees Celsius. }
    wind_kmh: { type: number, description: Sustained wind speed in km/h. }
    gust_kmh: { type: number, description: Wind gust speed in km/h. }
    precip_mm: { type: number, description: Precipitation in mm for the hour. }
    risk: { type: number, description: Storm risk between 0 and 1. }
    breach: { type: boolean, description: True when risk is at or above the 0.75 payout threshold. }
    valid_at: { type: string, description: UTC timestamp the forecast applies to. }
    source: { type: string }

# What the validator grades. `label_field` is the field it reads as the miner's
# answer, so it has to point at the substance — not at our product's own
# vocabulary. Pointing it at `breach`, a boolean, scored 0 across every epoch
# while miners declaring `summary`, `answer` or `current` scored around 0.01:
# grading "false" against a scraped weather reading compares nothing to
# something. The sentence carries every figure, so the sentence is the answer.
semantics:
  signal_mapping:
    confidence_field: risk
    label_field: summary
    reason_field: summary
  supported_intents:
    - WEATHER_FORECAST
    - WEATHER_CHECK
    - STORM_ALERT

# This block is what makes the miner reachable from an ERC-8183 job. Most
# registered miners omit it, which is why the on-chain rail has served 6 jobs in
# its lifetime: a job carries OnChainData arrays, and without a request mapping
# the node cannot turn them into an HTTP call.
on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: One-sentence plain-language forecast for the point and hour.
        source_path: summary
    integers:
      - index: 0
        name: temp_c_x100
        description: Temperature in degrees Celsius times 100.
        source_path: temp_c
        multiplier: 100
      - index: 1
        name: wind_kmh_x100
        description: Sustained wind speed in km/h times 100.
        source_path: wind_kmh
        multiplier: 100
      - index: 2
        name: precip_mm_x100
        description: Precipitation for the hour in mm times 100.
        source_path: precip_mm
        multiplier: 100
      - index: 3
        name: risk_x10000
        description: Storm risk between 0 and 1 times 10000.
        source_path: risk
        multiplier: 10000
    bools:
      - index: 0
        name: breach
        description: True when storm risk is at or above the 0.75 payout threshold.
        source_path: breach
        transform_rule: bool_from_eq:true
  request:
    - endpoint: forecast
      method: POST
      content_type: application/json
      body:
        lat: { source: strings.0, type: float }
        lon: { source: strings.1, type: float }
        hours: { source: numbers.0, type: int, optional: true }
