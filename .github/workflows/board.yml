name: storm board

# Screen the shipping lanes through Telegraph and publish the result.
#
# The board is committed to its own `board` branch, never to `main`. That is
# deliberate: a data commit on main would trigger a Vercel build for every
# refresh, and the free tier allows a hundred deployments a day — a schedule
# that quietly eats them would take the miner offline for the worst possible
# reason. The miner serves this file by fetching the branch, so the data can
# change as often as it likes without a single redeploy.

on:
  schedule:
    # Every twelve hours. At ten lanes and three legs that is 30 paid calls a
    # run, about $0.30, so roughly $0.60 a day — the cadence is a budget
    # decision as much as a freshness one.
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Hard spend cap for this run, in USD"
        default: "0.70"
      legs:
        description: "Waypoints per lane (2-12)"
        default: "3"

concurrency:
  # Two runs screening the same lanes would double the spend and race on the
  # branch. The later one waits; it does not get cancelled, because a cancelled
  # run may already have paid for calls it never published.
  group: storm-board
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci

      # The last published board, so a failed screen below republishes what
      # was there rather than force-pushing a branch with no board on it — the
      # page already says "stale" when generated_at is old, and stale is a
      # better thing to show than nothing. Every scheduled run from 26 August
      # failed in ten seconds on a missing secret, and this step is why that
      # can no longer take the survey down with it.
      - name: Keep the last board
        run: curl -fsSL https://raw.githubusercontent.com/PugarHuda/amanat/board/board.json -o board.json || true

      # A run with an empty secret "succeeds" at every step and publishes a
      # stale board, which is how it went unnoticed for two days. Say so where
      # a person looks: the run summary.
      - name: Is the key there
        env:
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
        run: |
          if [ -z "$AGENT_PRIVATE_KEY" ]; then
            echo "::warning title=Board not refreshed::AGENT_PRIVATE_KEY is empty — set it with: gh secret set AGENT_PRIVATE_KEY --repo PugarHuda/amanat"
            echo "## Board not refreshed" >> "$GITHUB_STEP_SUMMARY"
            echo "The AGENT_PRIVATE_KEY secret is empty, so the paid screen was skipped and the last board was republished." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "key present (${#AGENT_PRIVATE_KEY} chars)"
          fi

      - name: Screen the lanes
        # Paid, and the only step that can fail for a reason outside this
        # repo. It must not stop the free survey from publishing.
        continue-on-error: true
        env:
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          TELEGRAPH_NODE: https://devnode.telegraphprotocol.com
          BASE_SEPOLIA_RPC: https://base-sepolia-rpc.publicnode.com
          TELEGRAPH_DIAMOND: "0x5a2324aA18613FAD4e44bDF0d6c73Ec1f6D87ff8"
          USDC: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
          AMANAT_MINER_URL: https://amanat-miner.vercel.app
        run: |
          node agent/board.mjs \
            --legs "${{ inputs.legs || '3' }}" \
            --budget "${{ inputs.budget || '0.70' }}"

      - name: Survey the scoring board
        # Public reads only, so this costs nothing and rides the board's
        # schedule rather than earning one of its own.
        if: always()
        env:
          TELEGRAPH_NODE: https://devnode.telegraphprotocol.com
        run: node agent/survey.mjs --json

      - name: Publish to the board branch
        if: always()
        run: |
          git config user.name "amanat-board"
          git config user.email "board@amanat.invalid"

          # An orphan branch holding the data files: no history to grow, nothing to
          # merge, and no path by which a data refresh can touch the source.
          git checkout --orphan board-tmp
          git rm -rf --cached . >/dev/null
          [ -f board.json ] && git add -f board.json
          [ -f survey.json ] && git add -f survey.json
          git commit -m "board $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin board-tmp:board
