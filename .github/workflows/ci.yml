# The scoring module is the part that has to be right, so CI builds it the way
# the protocol does and refuses anything the node would refuse: a WASM with host
# imports cannot instantiate in the sandbox, and a duplicate binary cannot be
# registered at all.
name: ci
on: [push, pull_request]

jobs:
  scorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cd scorer && cargo test
      - run: npm install
      - run: node scorer/build-profiles.mjs
      - name: every profile must beat the champion and hold every attack
        run: |
          node scorer/harness.mjs scorer/dist/*.wasm
          for f in scorer/dist/*.wasm; do
            node scorer/harness.mjs --attacks "$f" | grep -q LEAKS && {
              echo "attack leak in $f"; exit 1; }
          done
          echo "no attack leaks"

  miner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      # Hits the real upstream, which is the point: a miner that cannot answer
      # is a miner the node will drop.
      - run: node scripts/check-sources.mjs
      - run: node agent/test.mjs
      - run: node miner/test.mjs
      # Firefox and WebKit too: the page tests run on all three, and layout,
      # focus order and CSS support are exactly where engines disagree.
      - run: npx playwright install --with-deps chromium firefox webkit
      # Starts the miner itself and drives it end to end: the happy paths and
      # every failure path against the real upstream and the real chain, the
      # loading and error states against a stubbed one, and an axe-core
      # accessibility audit of the page in each state it can be in.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
