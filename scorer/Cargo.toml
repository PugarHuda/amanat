[package]
name    = "amanat-scorer"
version = "0.1.0"
edition = "2021"

# cargo build --release --target wasm32-unknown-unknown
# -> target/wasm32-unknown-unknown/release/amanat_scorer.wasm
[lib]
name       = "amanat_scorer"
crate-type = ["cdylib", "rlib"]

# No dependencies at all. Every float operation here is +, -, *, / and
# comparison, which IEEE-754 defines exactly, so two validators on different
# hosts return identical bits. Pulling in libm would buy transcendentals we do
# not need and a rounding surface we would have to trust.
[features]
default = []
# Tighter tolerance bands for the weather intents, where the ground truth is an
# instrument reading rather than a figure quoted in prose.
weather  = []   # a current reading: tight bands
forecast = []   # a prediction: honest uncertainty
finance  = []   # a price or count is exact
verdict  = []   # the answer is the call, not the figure
prose    = []   # no figure to check
authenticity = []   # a verdict on text with nothing to measure
# Same shape as `authenticity`, one fewer contrast pass. Three passes were
# already a retreat from four, and TEXT_AUTHENTICITY_CHECK still lost the same
# three fixtures across three builds — mid-quality answers saturating until
# they tie, and a tie is a lost pair under the ordering gate.
authenticity2 = []
# A result question is the one place where every figure can be right and the
# answer still wrong: "Boston beat New York 112-108" against a truth that New
# York won. This profile reads which side a result verb points at. Nothing else
# changes, and no other profile carries it.
game = []
# Same reading, plus the answer that names a winner without a verb. Registration
# 2650 was refused at 14 ordering wins against 15 with its margin already past
# the bar, and the case it lost was exactly that shape.
game2 = ["game"]
# Registration 1253 scored 15 of 15 on GAME_RESULT with no attribution at all;
# 2650 and 2652 both scored 14 with it. So the rule costs an ordering win on the
# node's corpus, and the loose verbs are where a false positive would come from:
# "took" is a result in "took it 3-2" and not in "took a beating", and "won"
# credits the nearest name before it, which a relative clause is not.
game3 = ["game2"]

[dependencies]

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
